<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Actions Konteyner Pipeline</title><desc id="desc">Git push ile başlayan checkout, Buildx, login, build, Trivy ve push adımlarından oluşan CI/CD pipeline.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#143456" flood-opacity=".14"/></filter><marker markerUnits="userSpaceOnUse" id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#167cc0"/></marker></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="60" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="800" fill="#0b1f4d">GitHub Actions Container Pipeline</text>
  <rect x="410" y="88" width="380" height="62" rx="24" fill="#0b1f4d" filter="url(#s)"/><text x="600" y="126" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="21" font-weight="800" fill="white">GIT PUSH • main / tag</text><path d="M600 153v52" stroke="#167cc0" stroke-width="6" marker-end="url(#a)"/>
  <rect x="70" y="215" width="1060" height="360" rx="30" fill="#eef8ff" stroke="#58aee6" stroke-width="2" filter="url(#s)"/><text x="120" y="265" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800" fill="#0b466f">GITHUB ACTIONS RUNNER</text><text x="1080" y="264" text-anchor="end" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#356987">OTOMATİK CI/CD</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="110" y="305" width="280" height="82" rx="17" fill="white" stroke="#b9dbef"/><circle cx="145" cy="346" r="22" fill="#1685c5"/><text x="145" y="353" text-anchor="middle" font-size="17" font-weight="800" fill="white">1</text><text x="180" y="338" font-size="18" font-weight="800" fill="#17324d">CHECKOUT</text><text x="180" y="363" font-size="14" fill="#55708f">Kaynak kodları al</text><rect x="460" y="305" width="280" height="82" rx="17" fill="white" stroke="#b9dbef"/><circle cx="495" cy="346" r="22" fill="#1685c5"/><text x="495" y="353" text-anchor="middle" font-size="17" font-weight="800" fill="white">2</text><text x="530" y="338" font-size="18" font-weight="800" fill="#17324d">SETUP BUILDX</text><text x="530" y="363" font-size="14" fill="#55708f">GHA cache etkin</text><rect x="810" y="305" width="280" height="82" rx="17" fill="white" stroke="#b9dbef"/><circle cx="845" cy="346" r="22" fill="#1685c5"/><text x="845" y="353" text-anchor="middle" font-size="17" font-weight="800" fill="white">3</text><text x="880" y="338" font-size="18" font-weight="800" fill="#17324d">REGISTRY LOGIN</text><text x="880" y="363" font-size="14" fill="#55708f">GitHub Secrets</text>
  <rect x="110" y="430" width="280" height="82" rx="17" fill="white" stroke="#b9dbef"/><circle cx="145" cy="471" r="22" fill="#0b63b6"/><text x="145" y="478" text-anchor="middle" font-size="17" font-weight="800" fill="white">4</text><text x="180" y="463" font-size="18" font-weight="800" fill="#17324d">DOCKER BUILD</text><text x="180" y="488" font-size="14" fill="#55708f">Cache ile hızlı build</text><rect x="460" y="430" width="280" height="82" rx="17" fill="#fff7ed" stroke="#f0a657"/><circle cx="495" cy="471" r="22" fill="#e88827"/><text x="495" y="478" text-anchor="middle" font-size="17" font-weight="800" fill="white">5</text><text x="530" y="463" font-size="18" font-weight="800" fill="#17324d">TRIVY SCAN</text><text x="530" y="488" font-size="14" fill="#8e6037">CRITICAL / HIGH gate</text><rect x="810" y="430" width="280" height="82" rx="17" fill="#effbf5" stroke="#55bd94"/><circle cx="845" cy="471" r="22" fill="#1aa675"/><text x="845" y="478" text-anchor="middle" font-size="17" font-weight="800" fill="white">6</text><text x="880" y="463" font-size="18" font-weight="800" fill="#17324d">DOCKER PUSH</text><text x="880" y="488" font-size="14" fill="#397762">Docker Hub / Harbor</text></g>
  <path d="M393 346h58m292 0h58M250 392v28m350-28v28m350-28v28" stroke="#167cc0" stroke-width="5" marker-end="url(#a)"/>
  <rect x="330" y="608" width="540" height="42" rx="21" fill="#1aa675"/><text x="600" y="635" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="white">QUALITY GATE GEÇERSE GÜVENLİ İMAJ YAYINLANIR</text>
</svg>
