<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">GitLab CI Konteyner Pipeline</title><desc id="desc">Hadolint, Docker build, Trivy security scan ve registry push aşamalarından oluşan pipeline.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#143456" flood-opacity=".14"/></filter><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#167cc0"/></marker></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="70" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="#0b1f4d">GitLab CI Container Pipeline</text><text x="600" y="105" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#55708f">Kod kalitesi, build, güvenlik ve dağıtım tek zincirde</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="45" y="210" width="245" height="270" rx="26" fill="#eef8ff" stroke="#58aee6" stroke-width="2" filter="url(#s)"/><circle cx="105" cy="271" r="32" fill="#1685c5"/><text x="105" y="280" text-anchor="middle" font-size="23" font-weight="800" fill="white">01</text><text x="155" y="265" font-size="25" font-weight="800" fill="#0b466f">LINT</text><text x="155" y="293" font-size="16" fill="#356987">Hadolint</text><rect x="80" y="333" width="175" height="92" rx="15" fill="white" stroke="#b9dbef"/><text x="167" y="370" text-anchor="middle" font-size="17" font-weight="800" fill="#17324d">DOCKERFILE</text><text x="167" y="397" text-anchor="middle" font-size="15" fill="#55708f">kalite kontrolü</text>
  <rect x="330" y="210" width="245" height="270" rx="26" fill="#eef8ff" stroke="#58aee6" stroke-width="2" filter="url(#s)"/><circle cx="390" cy="271" r="32" fill="#0b63b6"/><text x="390" y="280" text-anchor="middle" font-size="23" font-weight="800" fill="white">02</text><text x="440" y="265" font-size="25" font-weight="800" fill="#0b466f">BUILD</text><text x="440" y="293" font-size="16" fill="#356987">docker:dind</text><rect x="365" y="333" width="175" height="92" rx="15" fill="white" stroke="#b9dbef"/><text x="452" y="370" text-anchor="middle" font-size="17" font-weight="800" fill="#17324d">IMAGE.TAR</text><text x="452" y="397" text-anchor="middle" font-size="15" fill="#55708f">artifact üret</text>
  <rect x="615" y="210" width="245" height="270" rx="26" fill="#fff7ed" stroke="#f0a657" stroke-width="2" filter="url(#s)"/><circle cx="675" cy="271" r="32" fill="#e88827"/><text x="675" y="280" text-anchor="middle" font-size="23" font-weight="800" fill="white">03</text><text x="725" y="259" font-size="21" font-weight="800" fill="#774112">SECURITY</text><text x="725" y="286" font-size="21" font-weight="800" fill="#774112">SCAN</text><rect x="650" y="333" width="175" height="92" rx="15" fill="white" stroke="#f2c79d"/><text x="737" y="370" text-anchor="middle" font-size="17" font-weight="800" fill="#17324d">TRIVY CVE</text><text x="737" y="397" text-anchor="middle" font-size="15" fill="#8e6037">image.tar tara</text>
  <rect x="900" y="210" width="255" height="270" rx="26" fill="#effbf5" stroke="#55bd94" stroke-width="2" filter="url(#s)"/><circle cx="960" cy="271" r="32" fill="#1aa675"/><text x="960" y="280" text-anchor="middle" font-size="23" font-weight="800" fill="white">04</text><text x="1010" y="265" font-size="25" font-weight="800" fill="#0a5a42">PUSH</text><text x="1010" y="293" font-size="16" fill="#397762">Registry</text><rect x="935" y="333" width="185" height="92" rx="15" fill="white" stroke="#b7e1d1"/><text x="1027" y="370" text-anchor="middle" font-size="17" font-weight="800" fill="#17324d">GITLAB</text><text x="1027" y="397" text-anchor="middle" font-size="15" fill="#55708f">veya Harbor</text></g>
  <path d="M295 345h27m258 0h27m258 0h27" stroke="#167cc0" stroke-width="6" marker-end="url(#a)"/>
  <rect x="220" y="540" width="760" height="66" rx="25" fill="#0b1f4d"/><text x="600" y="568" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="white">LINT → BUILD → SECURITY-SCAN → PUSH</text><text x="600" y="591" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#cde2f3">Her aşama başarılı olursa bir sonraki aşama çalışır</text>
</svg>
