name: Docker Build, Scan and Push Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: devops/microservice-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Kaynak Kodlari Cekme (Checkout)
        uses: actions/checkout@v4

      - name: 2. Docker Buildx Kurulumu
        uses: docker/setup-buildx-action@v3

      - name: 3. Docker Hub Oturumu Acma
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 4. Docker Meta (Semantik Etiketler)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=commit-

      - name: 5. Imaj Derleme (Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:test-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 6. Trivy Guvenlik Taramasi (CVE Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test-scan
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: 7. Nihai Imajı Registry'ye Pushlama
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
