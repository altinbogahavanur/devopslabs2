<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Geleneksel ve Distroless İmaj Karşılaştırması</title><desc id="desc">Geleneksel imajın geniş araç seti ile Distroless imajın minimal ve non-root yapısını karşılaştırır.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#143456" flood-opacity=".14"/></filter></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="65" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="#0b1f4d">Konteyner İmajı Saldırı Yüzeyi</text><text x="600" y="99" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#55708f">Gereksiz araçları kaldır, uygulamayı non-root çalıştır</text>
  <rect x="60" y="140" width="515" height="445" rx="28" fill="#fff5f5" stroke="#ed7777" stroke-width="2" filter="url(#s)"/><circle cx="125" cy="208" r="36" fill="#e64b4b"/><path d="M108 191l34 34m0-34l-34 34" stroke="white" stroke-width="8" stroke-linecap="round"/><text x="182" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" fill="#8d2929">GELENEKSEL İMAJ</text><text x="182" y="233" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#a34a4a">Ubuntu / Debian tabanlı</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="100" y="284" width="435" height="64" rx="15" fill="white" stroke="#f0b9b9"/><text x="130" y="324" font-size="20" font-weight="700" fill="#26384b">Bash • Apt • Curl • Sudo</text><rect x="100" y="369" width="435" height="64" rx="15" fill="white" stroke="#f0b9b9"/><text x="130" y="409" font-size="20" font-weight="700" fill="#26384b">Geniş saldırı yüzeyi</text><rect x="100" y="454" width="435" height="82" rx="15" fill="#e64b4b"/><text x="317" y="487" text-anchor="middle" font-size="19" font-weight="800" fill="white">REVERSE SHELL RİSKİ</text><text x="317" y="514" text-anchor="middle" font-size="16" fill="#ffe6e6">Kabuk ve paket araçları mevcut</text></g>
  <rect x="625" y="140" width="515" height="445" rx="28" fill="#effbf5" stroke="#55bd94" stroke-width="2" filter="url(#s)"/><circle cx="690" cy="208" r="36" fill="#1aa675"/><path d="M672 206l12 12 25-29" fill="none" stroke="white" stroke-width="8" stroke-linecap="round"/><text x="747" y="202" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="800" fill="#0a5a42">DISTROLESS İMAJ</text><text x="747" y="233" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#397762">distroless/nodejs20-debian12</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="665" y="284" width="435" height="64" rx="15" fill="white" stroke="#b7e1d1"/><text x="695" y="324" font-size="20" font-weight="700" fill="#26384b">Yalnızca runtime + uygulama</text><rect x="665" y="369" width="435" height="64" rx="15" fill="white" stroke="#b7e1d1"/><text x="695" y="409" font-size="20" font-weight="700" fill="#26384b">sh / bash bulunmaz</text><rect x="665" y="454" width="435" height="82" rx="15" fill="#1aa675"/><text x="882" y="487" text-anchor="middle" font-size="19" font-weight="800" fill="white">NON-ROOT ÇALIŞMA</text><text x="882" y="514" text-anchor="middle" font-size="16" fill="#e3fff5">nonroot:nonroot • UID 65532</text></g>
  <rect x="370" y="615" width="460" height="42" rx="21" fill="#0b1f4d"/><text x="600" y="642" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="white">DAHA KÜÇÜK • DAHA AZ YETKİ • DAHA GÜVENLİ</text>
</svg>
