<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Java Spring Boot Katmanlı Multi-Stage Build</title><desc id="desc">Maven builder aşamasında ayrıştırılan Spring Boot katmanları JRE tabanlı non-root runtime imajına aktarılır.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#143456" flood-opacity=".14"/></filter><marker markerUnits="userSpaceOnUse" id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#167cc0"/></marker></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="60" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="800" fill="#0b1f4d">Spring Boot Katmanlı Build</text><text x="600" y="94" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#55708f">Multi-stage + layertools ile daha küçük ve önbellek dostu imaj</text>
  <rect x="55" y="135" width="485" height="455" rx="28" fill="#eef8ff" stroke="#58aee6" stroke-width="2" filter="url(#s)"/><circle cx="118" cy="198" r="33" fill="#1685c5"/><text x="118" y="207" text-anchor="middle" font-family="Arial" font-size="23" font-weight="800" fill="white">01</text><text x="170" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#0b466f">MAVEN BUILDER</text><text x="170" y="220" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#356987">maven:3.9-eclipse-temurin-17</text>
  <rect x="92" y="260" width="410" height="62" rx="14" fill="white" stroke="#b9dbef"/><text x="117" y="287" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="700" fill="#17324d">mvn clean package</text><text x="117" y="309" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#55708f">pom.xml + kaynak kodlar derlenir</text>
  <text x="92" y="360" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#0b466f">LAYERTOOLS ÇIKTISI</text><g font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#28445d"><rect x="92" y="378" width="190" height="50" rx="12" fill="white" stroke="#b9dbef"/><text x="110" y="409">dependencies/</text><rect x="302" y="378" width="200" height="50" rx="12" fill="white" stroke="#b9dbef"/><text x="320" y="409">spring-boot-loader/</text><rect x="92" y="446" width="190" height="50" rx="12" fill="white" stroke="#b9dbef"/><text x="110" y="477">snapshot-deps/</text><rect x="302" y="446" width="200" height="50" rx="12" fill="#dff2ff" stroke="#58aee6"/><text x="320" y="477" font-weight="800">application/</text></g><rect x="132" y="525" width="330" height="42" rx="21" fill="#dbefff"/><text x="297" y="552" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="#1069a6">BUILD İMAJI • ~600 MB</text>
  <path d="M555 355h95" stroke="#167cc0" stroke-width="7" marker-end="url(#a)"/><rect x="538" y="287" width="130" height="46" rx="23" fill="#0b63b6"/><text x="603" y="307" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="white">KATMANLARI</text><text x="603" y="323" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" fill="white">AKTAR</text>
  <rect x="670" y="135" width="475" height="455" rx="28" fill="#effbf5" stroke="#55bd94" stroke-width="2" filter="url(#s)"/><circle cx="733" cy="198" r="33" fill="#1aa675"/><text x="733" y="207" text-anchor="middle" font-family="Arial" font-size="23" font-weight="800" fill="white">02</text><text x="785" y="190" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#0a5a42">JRE RUNTIME</text><text x="785" y="220" font-family="ui-monospace,Consolas,monospace" font-size="14" fill="#397762">temurin:17-jre-alpine • non-root</text>
  <rect x="707" y="260" width="401" height="72" rx="14" fill="white" stroke="#b7e1d1"/><text x="732" y="290" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#17324d">ÖNBELLEK DOSTU KATMANLAR</text><text x="732" y="316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#55708f">Bağımlılıklar değişmedikçe cached kalır</text>
  <rect x="707" y="352" width="401" height="72" rx="14" fill="white" stroke="#b7e1d1"/><text x="732" y="382" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#17324d">YALNIZCA KOD KATMANI</text><text x="732" y="408" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#55708f">application/ değişince yenilenir</text>
  <rect x="707" y="444" width="401" height="72" rx="14" fill="white" stroke="#b7e1d1"/><text x="732" y="474" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#17324d">NON-ROOT ÇALIŞMA</text><text x="732" y="500" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#55708f">Daha küçük saldırı yüzeyi</text><rect x="747" y="525" width="321" height="42" rx="21" fill="#1aa675"/><text x="907" y="552" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="800" fill="white">NİHAİ İMAJ • ~180 MB</text>
  <text x="600" y="636" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#294866">Sadece uygulama değiştiğinde hızlı yeniden build</text>
</svg>
