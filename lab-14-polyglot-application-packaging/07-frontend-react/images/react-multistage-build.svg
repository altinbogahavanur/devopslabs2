<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">React ve Nginx Multi-Stage Build</title><desc id="desc">Node ve Vite ile derlenen React uygulamasının yalnızca dist dosyaları Nginx runtime imajına aktarılır.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#143456" flood-opacity=".14"/></filter><marker markerUnits="userSpaceOnUse" id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#167cc0"/></marker></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="60" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="800" fill="#0b1f4d">React Multi-Stage Build</text><text x="600" y="94" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#55708f">Node.js derleme araçları üretim imajına taşınmaz</text>
  <rect x="65" y="145" width="430" height="405" rx="28" fill="#eef8ff" stroke="#58aee6" stroke-width="2" filter="url(#s)"/><circle cx="130" cy="208" r="34" fill="#1685c5"/><text x="130" y="217" text-anchor="middle" font-family="Arial" font-size="23" font-weight="800" fill="white">01</text><text x="185" y="200" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0b466f">BUILDER</text><text x="185" y="231" font-family="ui-monospace,Consolas,monospace" font-size="16" fill="#356987">node:20-alpine</text>
  <rect x="105" y="280" width="350" height="70" rx="15" fill="white" stroke="#b9dbef"/><text x="130" y="310" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700" fill="#17324d">npm run build</text><text x="130" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#55708f">Vite, JSX kodunu optimize eder</text><rect x="105" y="372" width="350" height="70" rx="15" fill="white" stroke="#b9dbef"/><text x="130" y="402" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#17324d">ÇIKTI: /app/dist</text><text x="130" y="426" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#55708f">HTML • CSS • JavaScript</text><rect x="145" y="472" width="270" height="45" rx="22" fill="#dbefff"/><text x="280" y="501" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#1069a6">AŞAMA • ~350 MB</text>
  <path d="M510 346h175" stroke="#167cc0" stroke-width="7" marker-end="url(#a)"/><rect x="512" y="275" width="168" height="48" rx="24" fill="#0b63b6"/><text x="596" y="296" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="white">SADECE DERLENMİŞ</text><text x="596" y="313" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800" fill="white">/dist DOSYALARI</text>
  <rect x="705" y="145" width="430" height="405" rx="28" fill="#effbf5" stroke="#55bd94" stroke-width="2" filter="url(#s)"/><circle cx="770" cy="208" r="34" fill="#1aa675"/><text x="770" y="217" text-anchor="middle" font-family="Arial" font-size="23" font-weight="800" fill="white">02</text><text x="825" y="200" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" fill="#0a5a42">RUNTIME</text><text x="825" y="231" font-family="ui-monospace,Consolas,monospace" font-size="16" fill="#397762">nginx:1.25-alpine</text>
  <rect x="745" y="280" width="350" height="70" rx="15" fill="white" stroke="#b7e1d1"/><text x="770" y="310" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#17324d">NODE.JS / NPM YOK</text><text x="770" y="334" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#55708f">Yalnızca statik dosyalar</text><rect x="745" y="372" width="350" height="70" rx="15" fill="white" stroke="#b7e1d1"/><text x="770" y="402" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="#17324d">SPA İÇİN HAZIR</text><text x="770" y="426" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#55708f">Gzip + try_files fallback</text><rect x="785" y="472" width="270" height="45" rx="22" fill="#1aa675"/><text x="920" y="501" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="800" fill="white">NİHAİ • ~25 MB</text>
  <rect x="375" y="592" width="450" height="48" rx="24" fill="#0b1f4d"/><text x="600" y="623" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800" fill="white">KÜÇÜK • HIZLI • ÜRETİME HAZIR</text>
</svg>
