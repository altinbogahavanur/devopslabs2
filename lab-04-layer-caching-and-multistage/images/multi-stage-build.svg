<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Go Multi-Stage Build Mimarisi</title><desc id="desc">Builder imajından yalnızca binary dosyasının küçük runtime imajına aktarılması.</desc>
