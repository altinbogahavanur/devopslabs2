  <rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="67" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="#0b1f4d">Go Multi-Stage Build</text><text x="600" y="101" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#55708f">Derleme araçlarını üretim imajından ayır</text>
