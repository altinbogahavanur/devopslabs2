  <rect x="105" y="280" width="350" height="68" rx="14" fill="white" stroke="#b9dbef"/><text x="130" y="321" font-family="ui-monospace,Consolas,monospace" font-size="20" font-weight="700" fill="#17324d">go build → app</text><rect x="105" y="366" width="350" height="68" rx="14" fill="white" stroke="#b9dbef"/><text x="130" y="407" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#17324d">Go SDK + derleme araçları</text><rect x="139" y="466" width="282" height="48" rx="24" fill="#dbefff"/><text x="280" y="497" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#1069a6">~800 MB</text>
