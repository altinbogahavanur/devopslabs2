<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Docker Katman Önbelleği Karşılaştırması</title>
  <desc id="desc">Kötü ve doğru Dockerfile sıralamasının önbellek davranışını karşılaştırır.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#16325c" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="38" font-weight="800" fill="#0b1f4d">Docker Katman Önbelleği</text>
  <text x="600" y="99" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#55708f">Dockerfile komut sırası, yeniden derleme süresini doğrudan etkiler</text>
  <rect x="60" y="135" width="510" height="475" rx="26" fill="#fff5f5" stroke="#ef6a6a" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="112" cy="188" r="26" fill="#e94343"/><path d="M100 176l24 24m0-24l-24 24" stroke="white" stroke-width="7" stroke-linecap="round"/>
  <text x="150" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#8e2020">KÖTÜ SIRALAMA</text>
  <text x="150" y="210" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" fill="#a53a3a">Dockerfile.slow</text>
  <rect x="94" y="250" width="442" height="83" rx="15" fill="white" stroke="#f0b3b3"/>
  <text x="118" y="282" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="21" font-weight="700" fill="#24354b">COPY . .</text>
  <text x="118" y="311" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#9b2f2f">Kod değişir → önbellek zinciri kırılır</text>
  <path d="M315 334v30" stroke="#d44949" stroke-width="5"/><path d="M305 356l10 12 10-12" fill="none" stroke="#d44949" stroke-width="5"/>
  <rect x="94" y="370" width="442" height="95" rx="15" fill="white" stroke="#f0b3b3"/>
  <text x="118" y="405" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="21" font-weight="700" fill="#24354b">RUN npm install</text>
  <text x="118" y="435" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#9b2f2f">Paketler değişmese de yeniden indirilir</text>
  <rect x="126" y="505" width="378" height="58" rx="29" fill="#e94343"/>
  <text x="315" y="541" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="white">YAVAŞ • ~45 SANİYE</text>
  <rect x="630" y="135" width="510" height="475" rx="26" fill="#f0fbf7" stroke="#3db489" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="682" cy="188" r="26" fill="#1aa675"/><path d="M669 188l9 9 18-20" fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="720" y="182" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" fill="#096849">DOĞRU SIRALAMA</text>
  <text x="720" y="210" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" fill="#25805f">Dockerfile.optimized</text>
  <rect x="664" y="242" width="442" height="68" rx="15" fill="white" stroke="#a8dfcb"/>
  <text x="688" y="283" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20" font-weight="700" fill="#24354b">COPY package*.json ./</text>
  <rect x="664" y="325" width="442" height="78" rx="15" fill="white" stroke="#a8dfcb"/>
  <text x="688" y="357" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20" font-weight="700" fill="#24354b">RUN npm install</text>
  <text x="688" y="384" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#15805b">CACHED • internete çıkmaz</text>
  <rect x="664" y="418" width="442" height="68" rx="15" fill="white" stroke="#a8dfcb"/>
  <text x="688" y="460" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="20" font-weight="700" fill="#24354b">COPY . .</text>
  <rect x="696" y="505" width="378" height="58" rx="29" fill="#1aa675"/>
  <text x="885" y="541" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="white">HIZLI • ~0.2 SANİYE</text>
</svg>
