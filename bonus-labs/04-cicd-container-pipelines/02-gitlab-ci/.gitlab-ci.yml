# ==============================================================================
# GitLab CI: Docker-in-Docker (dind) ile Imaj Derleme ve Harbor'a Push
# ==============================================================================
stages:
  - lint
  - build
  - security-scan
  - push

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

dockerfile-lint:
  stage: lint
  image: hadolint/hadolint:latest-alpine
  script:
    - hadolint Dockerfile || true

build-docker-image:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "Docker imajı derleniyor..."
    - docker build --pull -t "$IMAGE_TAG" .
    - docker save -o image.tar "$IMAGE_TAG"
  artifacts:
    paths:
      - image.tar
    expire_in: 1 hour

trivy-scan:
  stage: security-scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --input image.tar --severity HIGH,CRITICAL --exit-code 0
  dependencies:
    - build-docker-image

push-to-registry:
  stage: push
  image: docker:24.0
  services:
    - docker:24.0-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker load -i image.tar
    - docker tag "$IMAGE_TAG" "$IMAGE_LATEST"
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
  only:
    - main
