# ==============================================================================
# Docker Final Capstone: Uctan Uca Guvenli Mikroservis Platformu
# ==============================================================================
services:
  gateway:
    image: nginx:1.25-alpine
    container_name: capstone-gateway
    restart: always
    ports:
      - "${APP1_PORT:-19001}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - public-net

  backend:
    build:
      context: ./backend
    container_name: capstone-backend
    restart: always
    secrets:
      - db_password
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_USER=capstone_user
      - DB_NAME=capstonedb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - public-net
      - internal-net

  redis:
    image: redis:7-alpine
    container_name: capstone-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal-net

  postgres:
    image: postgres:16-alpine
    container_name: capstone-postgres
    restart: always
    secrets:
      - db_password
    environment:
      POSTGRES_USER: capstone_user
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: capstonedb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone_user -d capstonedb"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - internal-net

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  public-net:
    name: capstone-public-net
  internal-net:
    name: capstone-internal-net

volumes:
  pgdata:
    name: capstone-pgdata
