<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Docker Compose Sağlıklı Başlatma Zinciri</title><desc id="desc">Veritabanı healthy olduktan sonra web API servisinin başlatılması.</desc>
