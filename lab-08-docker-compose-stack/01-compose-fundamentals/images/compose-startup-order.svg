  <rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="63" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="800" fill="#0b1f4d">Docker Compose Başlatma Sırası</text><rect x="409" y="88" width="382" height="50" rx="25" fill="#0b63b6"/><text x="600" y="120" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="20" font-weight="700" fill="white">docker compose up -d</text>
