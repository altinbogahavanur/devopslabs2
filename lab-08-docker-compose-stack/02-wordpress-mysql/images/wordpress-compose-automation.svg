<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">WordPress ve MySQL Docker Compose Otomasyonu</title><desc id="desc">On beş manuel komut yerine tek Docker Compose komutuyla ağ, volume, MySQL ve WordPress oluşturulur.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#143456" flood-opacity=".14"/></filter><marker markerUnits="userSpaceOnUse" id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#1680c5"/></marker></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="62" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="37" font-weight="800" fill="#0b1f4d">WordPress Stack Otomasyonu</text><text x="600" y="96" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#55708f">15 ayrı CLI komutu yerine tek bildirimsel yapılandırma</text>
