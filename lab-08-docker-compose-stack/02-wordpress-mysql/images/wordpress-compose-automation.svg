  <g font-family="ui-monospace,Consolas,monospace" font-size="16" fill="#384a5c"><rect x="105" y="266" width="290" height="52" rx="12" fill="white" stroke="#f0b9b9"/><text x="125" y="298">docker network create</text><rect x="105" y="334" width="290" height="52" rx="12" fill="white" stroke="#f0b9b9"/><text x="125" y="366">docker volume create ×2</text><rect x="105" y="402" width="290" height="52" rx="12" fill="white" stroke="#f0b9b9"/><text x="125" y="434">docker run mysql ...</text><rect x="105" y="470" width="290" height="52" rx="12" fill="white" stroke="#f0b9b9"/><text x="125" y="502">docker run wordpress ...</text></g>
