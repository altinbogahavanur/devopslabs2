<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Docker İmaj Etiketleme ve Registry Akışı</title><desc id="desc">Tek yerel imajın public ve private Docker Hub depolarına gönderilme ve doğrulanma akışları.</desc>
  <defs><linearGradient id="bg"><stop stop-color="#f9fbff"/><stop offset="1" stop-color="#eef7ff"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#143456" flood-opacity=".14"/></filter><marker markerUnits="userSpaceOnUse" id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0l11 5.5L0 11z" fill="#187cc1"/></marker></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><text x="600" y="58" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="36" font-weight="800" fill="#0b1f4d">İmaj Etiketleme ve Registry Akışı</text>
  <rect x="360" y="88" width="480" height="104" rx="22" fill="white" stroke="#bfd4e8" filter="url(#s)"/><circle cx="415" cy="140" r="30" fill="#1685c5"/><path d="M395 140h40M405 128v24m20-24v24" stroke="white" stroke-width="3"/><text x="465" y="130" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#55708f">YEREL BUILD</text><text x="465" y="162" font-family="ui-monospace,Consolas,monospace" font-size="21" font-weight="800" fill="#17324d">devops-app:nginx-1.0</text><path d="M600 194v54m0 0H310v42m290-42h290v42" fill="none" stroke="#187cc1" stroke-width="6" marker-end="url(#a)"/>
  <rect x="70" y="300" width="480" height="310" rx="27" fill="#eef8ff" stroke="#58aee6" stroke-width="2" filter="url(#s)"/><circle cx="125" cy="354" r="28" fill="#1685c5"/><path d="M112 354h26m-13-13v26" stroke="white" stroke-width="3"/><text x="170" y="346" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#0b466f">PUBLIC REPOSITORY</text><text x="170" y="376" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#356987">hbayraktar/devops-app-pub:nginx-1.0</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="110" y="410" width="400" height="46" rx="12" fill="white" stroke="#b9dbef"/><text x="135" y="439" font-size="17" font-weight="700" fill="#17324d">1. Push → Run &amp; Curl (:8085)</text><rect x="110" y="470" width="400" height="46" rx="12" fill="white" stroke="#b9dbef"/><text x="135" y="499" font-size="17" font-weight="700" fill="#17324d">2. Lokalden sil → Hub'dan pull</text><rect x="110" y="530" width="400" height="46" rx="12" fill="#1aa675"/><text x="310" y="559" text-anchor="middle" font-size="17" font-weight="800" fill="white">ÇALIŞTIR VE DOĞRULA ✓</text></g>
  <rect x="650" y="300" width="480" height="310" rx="27" fill="#fff7ed" stroke="#f0a657" stroke-width="2" filter="url(#s)"/><circle cx="705" cy="354" r="28" fill="#e88827"/><rect x="693" y="348" width="24" height="18" rx="3" fill="none" stroke="white" stroke-width="3"/><path d="M698 348v-6a7 7 0 0114 0v6" fill="none" stroke="white" stroke-width="3"/><text x="750" y="346" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" fill="#774112">PRIVATE REPOSITORY</text><text x="750" y="376" font-family="ui-monospace,Consolas,monospace" font-size="15" fill="#8e6037">hbayraktar/devops-app:nginx-1.0</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="690" y="410" width="400" height="46" rx="12" fill="white" stroke="#f2c79d"/><text x="715" y="439" font-size="17" font-weight="700" fill="#17324d">1. Push → Run &amp; Curl (:8086)</text><rect x="690" y="470" width="400" height="46" rx="12" fill="#fff0e0" stroke="#eaa261"/><text x="715" y="499" font-size="17" font-weight="700" fill="#a14c18">2. Logout → Pull reddedilir</text><rect x="690" y="530" width="400" height="46" rx="12" fill="#1aa675"/><text x="890" y="559" text-anchor="middle" font-size="17" font-weight="800" fill="white">LOGIN → PULL → DOĞRULA ✓</text></g>
  <text x="600" y="651" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#55708f">Public erişim açıktır • Private erişim kimlik doğrulama gerektirir</text>
</svg>
